# environment.yml  [Shared conda environment for the shipping cost pipeline]
# Build once with: conda env create -f environment.yml
name: shipping-cost
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Pipeline packages (imported by src/)
  - pandas        # read and write tables (notebook cells 9 and 41)
  - numpy         # numeric arrays (cells 21 and 28)
  - scikit-learn  # ColumnTransformer, RandomForestRegressor, metrics (cells 24, 26 and 28)
  - joblib        # save and load the fitted model (cells 37 and 39)
  - pyyaml        # read config.yaml (load_config in src/main.py)
    # Development tools (check the code, not needed to run it)
  - pytest      # test runner
  - pytest-cov  # coverage report: pytest --cov=src
  - flake8      # style checker