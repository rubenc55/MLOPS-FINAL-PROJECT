# pytest.ini  [Test runner settings]
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = notebooks data models reports logs wandb .git __pycache__ .pytest-tmp
# Use disposable, repo-local test files to avoid some Windows temp permission issues.
# pytest clears ONLY the dedicated .pytest-tmp folder before each run.
# It sits at the repo root, which always exists: under .pytest_cache/ the first run on a fresh
# clone (CI, the grader) fails, because that folder is only created after pytest has run once.
# .gitignore excludes .pytest-tmp/
addopts = -q --basetemp=.pytest-tmp